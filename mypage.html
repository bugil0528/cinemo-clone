<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Cinemo-My Page</title>
  </head>
  <body>
    <main>
      <section class="page-introduction">
        <p class="eyebrow">MY CINEMO</p>
        <h2 class="page-title">마이페이지</h2>
        <p class="description">취향을 모으고, 나만의 시간을 이어가세요.</p>
      </section>
      
      <section class="user-profile-panel">
        <div class="profile-information">
          <img />
          <div class="user-details">
            <div class="profile-heading">
              <p class="name">욜로</p>
              <p class="profile-badge">기본 프로필</p>
            </div>
            <p class="personal-caption">나만의 영화 노트</p>
            <p class="">2026년 10월부터 함께하는 중</p>
          </div>
        </div>
        <button type="button" class="btn-profile-edit">
          <img class="users">
          <span class="label">프로필 변경</span>
        </button>
      </section>

      <section class="saved-content">
        <div class="section-heading">
          <h2 class="title">내가 찜한 콘텐츠</h2>
          <p class="section-note">4편</p>
        </div>
      </section>

      <section class="account-settings">
        <div class="section-header">
          <h2 class="title">계정 설정</h2>
          <hr />
        </div>

        <div class="settings-list">
          <div class="account-setting-row">
            <p class="setting-label">이메일</p>
            <p class="setting-value">yolo202617@example.com</p>
            <button class="setting-action">변경</button>
            <hr/>
          </div>
          <div class="account-setting-row">
            <p class="setting-label">비밀번호</p>
            <p class="setting-value">************</p>
            <button class="setting-action">변경</button>
            <hr />
          </div>
          <div class="account-setting-row">
            <p class="setting-label">멤버십</p>
            <p class="setting-value">베이식 월 9,500원</p>
            <button class="setting-action">관리</button>
            <hr />
          </div>
          <div class="account-setting-row">
            <p class="setting-label">표시 언어</p>
            <p class="setting-value">한국어</p>
            <button class="setting-action">변경</button>
            <hr />
          </div>

        <div class="session-actions">
          <p class="session-note">내 계정으로 접속 중입니다.</p>
          <button class="logout-link">로그아웃</button>
        </div>
        </button>
      </section>

    </main>
  </body>
</html>
