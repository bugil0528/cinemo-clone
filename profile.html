<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Cinemo-Profile</title>
    <link rel="stylesheet" href="./styles/style.css" />
  </head>
  <body>
    <header class="header">
      <section class="brand-and-navigation">
        <div class="netflex-identity">
          <h1 class="wordmark">
            <img src="./assets/svg/Brand mark.svg" alt="" />
            CINEMO
          </h1>
        </div>
      </section>
    </header>
    <main class="profile-selection">
      <section class="profile-introduction">
        <h1 class="eyebrow">YOUR OWN SCENE</h1>
        <p class="page-title">누구의 시간인가요?</p>
        <p class="description">함께 보는 이야기, 취향은 각자의 방식으로.</p>
      </section>
      <section class="profile-options">
        <div class="profile-card">
          <img src="./assets/avatar/Avatar-s.png" alt="프로필 욜로의 이미지" />
          <h2>욜로</h2>
          <p>나만의 영화 노트</p>
        </div>
        <div class="profile-card">
          <img src="./assets/avatar/Avatar-j.png" alt="프로필 지호의 이미지" />
          <h2>지호</h2>
          <p>새로운 장면을 찾아서</p>
        </div>
        <div class="profile-card">
          <img src="./assets/avatar/Avatar-m.png" alt="프로필 민의 이미지" />
          <h2>민</h2>
          <p>오늘도 한편</p>
        </div>
        <div class="profile-card">
          <img
            src="./assets/avatar/Avatar-g.png"
            alt="프로필 게스트의 이미지"
          />
          <h2>게스트</h2>
          <p>가볍게 둘러보기</p>
        </div>
      </section>
      <section class="button">
        <button>
          <img src="./assets/svg/pencil.svg" alt="" />
          프로필 관리
        </button>
      </section>
    </main>
    <footer>
      <section class="project-note">
        <p>당신의 다음 장면을 만나는 곳, CINEMO</p>
      </section>
    </footer>
  </body>
</html>
