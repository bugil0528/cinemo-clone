<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Cinemo-Home</title>

    <link rel="stylesheet" href="./styles/reset.css" />
    <link rel="stylesheet" href="./styles/style.css" />
  </head>
  <body>
    <header></header>
    <main>
      <section class="featured-film">
        <img
          class="hero-quiet-orbit"
          src="./assets/img/quiet-orbit.png"
          alt="어두운 바닷가에 거대한 비석이 서 있고 그 앞에서 한명의 사람이 바라보고 있다"
        />

        <div class="featured-story">
          <div class="editorial-label">
            <span class="collection-label">이번 주의 발견</span>
            <span class="collection-number">VOL. 01</span>
          </div>

          <div class="film-title">
            <h1 class="korean-title">고요의 궤도</h1>
            <p class="english-titile">QUIET ORBIT</p>
          </div>

          <div class="film-metadata">
            <p class="year-and-genre">
              <span class="year deco-dot">2026</span>
              <span class="genre deco-dot">SF</span>
              <span class="genre deco-dot">미스터리</span>
            </p>
            <p class="age-rating">15+</p>
            <p class="duration">1시간 48분</p>
          </div>

          <p class="synopsis">
            모든 소리가 사라진 해안, 정체를 알 수 없는 신호가 도착한다. 마지막
            관측자는 그 고요 속으로 한 걸음 다가선다.
          </p>

          <div class="film-actions">
            <button type="button" class="button-detail">
              <svg
                width="18"
                height="18"
                viewBox="0 0 18 18"
                fill="none"
                xmlns="http://www.w3.org/2000/svg"
              >
                <path
                  d="M12.7494 12.7494V5.2506H5.25061M12.7494 5.2506L5.25061 12.7494"
                  stroke-width="1.7"
                  stroke-linecap="round"
                  stroke="#241512"
                />
              </svg>

              작품 살펴보기
            </button>

            <button type="button" class="button-save">
              <svg
                width="18"
                height="18"
                viewBox="0 0 18 18"
                fill="none"
                xmlns="http://www.w3.org/2000/svg"
              >
                <path
                  d="M3.74939 9H8.99999M8.99999 9H14.2506M8.99999 9V3.7494M8.99999 9V14.2506"
                  stroke-width="1.7"
                  stroke-linecap="round"
                  stroke="#F3F1ED"
                />
              </svg>

              찜하기
            </button>
          </div>
        </div>

        <div class="editorial-aside">
          <p class="editorial-quote">고요가 시작되는 곳, 이야기가 깨어난다.</p>
          <p class="collection-description">A CINEMO ORIGINAL CONCEPT</p>
        </div>
      </section>

      <section class="browse-collection">
        <article class="content-collection">
          <div class="collection introduction">
            <div class="section-heading">
              <p class="title">오늘, 새로운 세계로</p>
              <p class="section-note">4편의 이야기</p>
            </div>
            <p class="collection-description">
              낯선 풍경 속에서 시작되는 네편의 이야기
            </p>
          </div>
          <div class="horizontal-scroll-content">
            <a haef="#" cals=" content-card">
              <img clss="artwork" src="./assets/img/quiet-orbit.png" />
            </a>
          </div>
        </article>
      </section>
    </main>
    <footer></footer>
  </body>
</html>
